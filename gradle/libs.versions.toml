# ==============================
# Version References
# ==============================

[versions]

# Android Gradle Plugin & Kotlin
agp = "8.11.2"                           # Android Gradle Plugin
kotlin = "2.2.20"                        # Kotlin version

# Core AndroidX
coreKtx = "1.17.0"                       # Kotlin extensions for Android core libraries

# Testing
junit = "4.13.2"                         # Unit testing (Java)
junitVersion = "1.3.0"                   # AndroidX JUnit extension
espressoCore = "3.7.0"                   # UI testing with Espresso

# Lifecycle & Compose
lifecycleRuntimeKtx = "2.9.4"            # Lifecycle-aware components
activityCompose = "1.11.0"               # Compose support for Activity
composeBom = "2025.10.00"                # Compose Bill of Materials
composeIcons = "1.7.8"                   # match your compose version

# Dependency Injection - Koin
koin = "4.1.1"                           # Koin for DI

# Room Database
room = "2.8.2"                           # Room persistence library

# Network - Retrofit + OkHttp
retrofit = "3.0.0"                       # Retrofit for REST API
okhttp = "5.2.1"                         # OkHttp client
loggingInterceptor = "5.2.1"             # Logging for OkHttp

# ViewModel, LiveData, etc.
lifecycle = "2.9.4"                      # ViewModel, LiveData, etc.

# Coroutines
coroutines = "1.10.2"                    # Kotlin coroutines for async operations

# Navigation
navigation = "2.9.5"                     # Jetpack Navigation

# DataStore
datastore = "1.1.7"                      # Jetpack DataStore (key-value)

# Coil
coil = "2.7.0"                           # Image loading with Coil

# Media3 (ExoPlayer)
media3 = "1.8.0"                         # Media3 ExoPlayer library

# Accompanist Pager
accompanistPager = "0.36.0"

# Accompanist Pager Indicators
accompanistPagerIndicators = "0.36.0"

# SpinKit - Progressbar
spinkit = "1.4.0"

material3 = "1.2.1"
foundation = "1.9.3"

appcompat = "1.7.1"

# ==============================
# Libraries
# ==============================

[libraries]
# Core KTX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Lifecycle & Activity Compose
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Jetpack Compose BOM & UI Components
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# Compose Material Icons
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeIcons" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }

# Koin (Dependency Injection)
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Media3 ExoPlayer
exoplayer-core = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
exoplayer-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Accompanist (Permissions)
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version = "0.37.3" }

accompanist-pager = { group = "com.google.accompanist", name = "accompanist-pager", version.ref = "accompanistPager" }
accompanist-pager-indicators = { group = "com.google.accompanist", name = "accompanist-pager-indicators", version.ref = "accompanistPagerIndicators" }

# Gson (JSON Parsing)
gson = { group = "com.google.code.gson", name = "gson", version = "2.13.2" }

# Room Database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Google Maps & Location
maps = { group = "com.google.android.gms", name = "play-services-maps", version = "19.2.0" }
location = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }

# WorkManager (Background Tasks)
workManager = { group = "androidx.work", name = "work-runtime-ktx", version = "2.10.5" }

# Retrofit + OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }

# Lifecycle + ViewModel + LiveData + StateFlow
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# DataStore Preferences
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil for Image Loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Spinkit for Progressbar
spinkit = { module = "com.github.ybq:Android-SpinKit", version.ref = "spinkit" }

foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }


# ==============================
# Plugin Referencesli
# ==============================

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }           # Android app plugin
android-library = { id = "com.android.library" }                                        # Android library plugin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }        # Kotlin Android plugin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Jetpack Compose plugin
ksp = { id = "com.google.devtools.ksp", version = "1.9.25-1.0.20" }                     # Kotlin Symbol Processing