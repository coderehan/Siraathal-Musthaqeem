# ---------- Project-wide Gradle settings ----------

# JVM memory & encoding
# Increase heap to 6g and metaspace to 1.5g
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use Gradle daemon for faster incremental builds
org.gradle.daemon=true

# Parallel & on-demand configuration
org.gradle.parallel=true
org.gradle.configureondemand=true

# Kotlin compiler memory
# Fix property name & increase to 4 GB (correct key is kotlin.daemon.jvmargs)
kotlin.daemon.jvmargs=-Xmx4g

# AndroidX & Kotlin settings
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Use KSP 2 (recommended for Kotlin 2.2+)
ksp.useKSP2=true
